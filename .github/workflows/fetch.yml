name: Fetch filings and news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Re-score ALL items (after tuning rules)"
        type: boolean
        default: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r fetcher/requirements.txt
      - name: NSE filings
        run: python fetcher/fetch_filings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Media news
        if: always()
        run: python fetcher/fetch_media.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Score unscored items
        if: always()
        run: python fetcher/rescore.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESCORE_ALL: ${{ github.event.inputs.rescore_all }}
