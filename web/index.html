<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPulse</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f4f5f7;--ok:#0a7d33;--med:#1a5fd0}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1c1d20;--ok:#4cd07d;--med:#6ea2ff}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);padding:12px;border-bottom:1px solid var(--card);z-index:2}
h1{font-size:18px;margin:0 0 8px}
input,select{padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg);font-size:14px}
input{width:52%}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tab{padding:6px 12px;border-radius:16px;background:var(--card);border:0;color:var(--fg);font-size:13px;white-space:nowrap}
.tab.on{background:var(--fg);color:var(--bg)}
.card{background:var(--card);margin:10px 12px;padding:12px;border-radius:12px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;border:1px solid}
.official{color:var(--ok)}.media{color:var(--med)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;float:right}
.positive{color:var(--ok)}.caution{color:#d33}.watch{color:#c80}
.why{font-size:12px;margin:6px 0 0;color:var(--fg)}
.chip{font-size:11px;background:var(--bg);border-radius:10px;padding:2px 7px;margin-right:4px}
.body{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mut);font-size:12px;margin-top:6px}
a{color:inherit}
</style></head><body>
<header>
<h1>StockPulse</h1>
<input id="q" placeholder="Search company / symbol">
<select id="src"><option value="">All sources</option><option>NSE</option><option>Economic Times</option><option>Business Standard</option><option>Mint</option><option>Moneycontrol</option><option>Reuters</option></select>
<div class="tabs" id="tabs">
<button class="tab on" data-t="signals">Signals</button>
<button class="tab" data-t="all">All</button>
<button class="tab" data-t="filings">Filings</button>
<button class="tab" data-t="stocknews">Stock news</button>
<button class="tab" data-t="market">Market &amp; economy</button>
</div>
</header>
<main id="list"><p class="card">Loading…</p></main>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="signals";
async function load(){
  const {SUPABASE_URL:u,SUPABASE_ANON_KEY:k}=window.CONFIG;
  let url=`${u}/rest/v1/items?select=*&order=published_at.desc.nullslast&limit=100`;
  if(tab==="signals"){const d=new Date(Date.now()-3*864e5).toISOString();
    url=`${u}/rest/v1/items?select=*&signal=neq.neutral&score=gte.2&published_at=gte.${d}&order=score.desc,published_at.desc&limit=100`;}
  if(tab==="filings") url+="&kind=eq.official";
  if(tab==="stocknews") url+="&kind=eq.media&matched_symbols=not.eq.{}";
  if(tab==="market") url+="&kind=eq.media&matched_symbols=eq.{}";
  if($("src").value) url+=`&source=eq.${encodeURIComponent($("src").value)}`;
  const q=$("q").value.trim().replace(/[,()*]/g,"");
  if(q) url+=`&or=(company.ilike.*${q}*,symbol.ilike.*${q}*,title.ilike.*${q}*)`;
  try{
    const r=await fetch(url,{headers:{apikey:k,Authorization:`Bearer ${k}`}});
    if(!r.ok) throw new Error(r.status);
    const rows=await r.json();
    $("list").innerHTML=rows.length?rows.map(i=>{
      const off=i.kind==="official";
      const chips=(i.matched_symbols||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("");
      return `<div class="card">
      ${i.signal&&i.signal!=="neutral"?`<span class="pill ${i.signal}">${{positive:"▲ POSITIVE",caution:"▼ CAUTION",watch:"● WATCH"}[i.signal]} ${i.score}/10</span>`:""}
      <span class="badge ${off?"official":"media"}">${off?"OFFICIAL":"MEDIA"} · ${esc(i.source)}</span>
      <b>${esc(i.company||i.symbol||"")}</b>
      <p>${esc(i.title)}</p>${i.reason?`<div class="why">Why: ${esc(i.reason)}</div>`:""}${(i.summary||i.body)?`<div class="body">${esc(i.summary||i.body)}</div>`:""}
      <div class="meta">${chips}${i.summary_source==="gemini"||i.summary_source==="groq"?`<span class="chip">AI summary</span>`:""}${i.sources_count>1?`<span class="chip">✔ ${i.sources_count} sources</span>`:""} ${i.published_at?new Date(i.published_at).toLocaleString():""}
      ${i.url?` · <a href="${esc(i.url)}" target="_blank" rel="noopener">Read original</a>`:""}</div></div>`}).join("")
      :'<p class="card">Nothing here yet.</p>';
  }catch(e){$("list").innerHTML=`<p class="card">Could not load (${esc(e.message)}). Check config.js.</p>`}
}
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));load()};
$("q").oninput=()=>{clearTimeout(window.t);window.t=setTimeout(load,300)};
$("src").onchange=load; load();
</script></body></html>
